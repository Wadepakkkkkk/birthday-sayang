<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ♡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SCENE 1 -->
  <section id="start-screen" class="screen">

    <h1>READY?</h1>

    <button id="start-btn">
      START ♡
    </button>

  </section>


  <!-- SCENE 2 -->
  <section id="scene-2" class="screen hidden">

    <div class="scene-box">

      <div class="heart">
        ♡
      </div>

      <h2>Hi Sayang!</h2>

      <p>
        I made something special for you...
      </p>

      <button id="continue-btn">
        CONTINUE ♡
      </button>

    </div>

  </section>


  <!-- SCENE 3 -->
<section id="scene-3" class="screen hidden">

  <div class="scene-box">

    <div class="heart">
      ♡
    </div>

    <h2>Do you remember?</h2>

    <p>
      The little moments we shared...
    </p>

    <button id="next-btn">
      NEXT ♡
    </button>

  </div>

</section>
  <!-- SCENE 4 -->
<section id="scene-4" class="screen hidden">

  <div class="pixel-scene">

    <h2>Just us ♡</h2>

    <div class="characters">

      <img
        src="spiderman.png"
        alt="Spider-Man"
        class="pixel-character"
      >

      <div class="love-heart">♡</div>

      <img
        src="spidergwen.png"
        alt="Spider-Gwen"
        class="pixel-character"
      >

    </div>

    <div class="dialog-box">
      <p>Would you stay with me through every universe?</p>

      <div class="choice-buttons">
        <button id="yes-btn">YES ♡</button>
        <button id="no-btn">NO</button>
      </div>
    </div>

  </div>

</section>
  <script src="script.js"></script>

</body>

</html>
