<!-- UNIVERSE -->
<section class="scene universe-scene" id="sceneUniverse">

  <!-- BACKGROUND DECORATIONS -->
  <div class="universe-decor">

    <!-- PIXEL CLOUDS -->
    <div class="u-cloud u-cloud-1"></div>
    <div class="u-cloud u-cloud-2"></div>
    <div class="u-cloud u-cloud-3"></div>

    <!-- FLOATING DECORATIONS -->
    <span class="u-heart u-heart-1">♡</span>
    <span class="u-heart u-heart-2">♡</span>
    <span class="u-heart u-heart-3">♡</span>

    <span class="u-sparkle u-sparkle-1">✦</span>
    <span class="u-sparkle u-sparkle-2">✧</span>
    <span class="u-sparkle u-sparkle-3">✦</span>
    <span class="u-sparkle u-sparkle-4">✧</span>

    <!-- GROUND DECORATIONS -->
    <div class="u-bush bush-1"></div>
    <div class="u-bush bush-2"></div>

    <div class="u-mushroom mushroom-1">
      <div class="mushroom-top"></div>
      <div class="mushroom-stem"></div>
    </div>

    <div class="u-mushroom mushroom-2">
      <div class="mushroom-top"></div>
      <div class="mushroom-stem"></div>
    </div>

    <div class="u-flower flowers-left">
      ✿　✧　✿
    </div>

    <div class="u-flower flowers-right">
      ✿　✧　✿
    </div>

    <div class="universe-sign">
      LEVEL ♡
    </div>

  </div>


  <!-- MAIN CONTENT -->
  <div class="universe-content">

    <p class="tiny-title universe-small-title">
      ACROSS EVERY UNIVERSE
    </p>

    <h1 class="page-title universe-title">
      Just us ♡
    </h1>


    <!-- CHARACTERS -->
    <div class="couple-area">

      <div class="person">

        <div class="character-glow">

          <img
            src="gambar1.png"
            alt="Hanif"
          >

        </div>

        <span>HANIF</span>

      </div>


      <div class="between-heart">
        ♡
      </div>


      <div class="person">

        <div class="character-glow">

          <img
            src="gambar2.png"
            alt="Dee"
          >

        </div>

        <span>DEE</span>

      </div>

    </div>


    <!-- QUESTION -->
    <div class="universe-question pixel-panel">

      <p>
        Would you stay with me through every universe?
      </p>

      <div class="universe-buttons">

        <button
          class="pixel-btn"
          onclick="sayYes()"
        >
          YES ♡
        </button>

        <button
          class="pixel-btn no-btn"
          id="noButton"
          onclick="moveNoButton()"
        >
          NO
        </button>

      </div>

    </div>

  </div>

</section>
